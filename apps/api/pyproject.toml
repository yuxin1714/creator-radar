[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-radar-api"
version = "0.1.0"
description = "Creator Radar API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
]

[project.optional-dependencies]
local-asr = [
  "faster-whisper>=1.2,<2",
  "nvidia-cublas-cu12>=12.9,<13; platform_system == 'Windows'",
  "nvidia-cudnn-cu12>=9.10,<10; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
